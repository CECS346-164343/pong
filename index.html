<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pong</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-label="Pong game">
      <h1>PONG</h1>
      <div class="scoreboard" aria-live="polite">
        <span id="playerScore">0</span>
        <span class="score-divider">:</span>
        <span id="cpuScore">0</span>
      </div>

      <canvas id="gameCanvas" width="960" height="540" aria-label="Pong playing field"></canvas>

      <div class="controls">
        <button id="startButton" type="button">Start</button>
        <button id="pauseButton" type="button" disabled>Pause</button>
        <button id="resetButton" type="button">Reset</button>
      </div>
      <p class="instructions">Move with W / S or the arrow keys. First to 7 wins.</p>
    </main>

    <script src="game.js"></script>
  </body>
</html>
